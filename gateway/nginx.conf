events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Límite para subida de exámenes médicos, fotos e imágenes de Nano
    client_max_body_size 50M;

    # Resuelve correctamente el protocolo HTTPS cuando viene de Cloudflare Tunnel
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    upstream backend_service {
        server backend:3000;
    }

    upstream landing_service {
        server landing:4200;
    }

    upstream app_web_service {
        server app-web:8081;
    }

    server {
        listen 80;
        server_name _;

        # 1. Backend REST API y Swagger (/api/)
        location /api/ {
            proxy_pass http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_read_timeout 90s;
        }

        # 2. Bundles y estáticos de Expo (_expo/)
        location /_expo/ {
            proxy_pass http://app_web_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # 3. App Web Expo - Redirección canónica de /app a /app/
        location = /app {
            return 301 $scheme://$http_host/app/;
        }

        # 3.1 App Web Expo (/app/)
        location /app/ {
            proxy_pass http://app_web_service/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        }

        # 4. Landing Page Angular (Raíz /)
        location / {
            proxy_pass http://landing_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        }
    }
}
