services:
  - type: web
    name: gestionsalud-backend
    runtime: node
    rootDir: Backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: ALTCHA_HMAC_SECRET
        generateValue: true
    buildFilter:
      paths:
        - Backend/**
      ignoredPaths:
        - Documentacion/**
        - "Landing page/**"
        - "App movil/**"
